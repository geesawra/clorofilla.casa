apiVersion: v1
kind: Namespace
metadata:
    name: home-automation
---
apiVersion: v1
kind: PersistentVolume
metadata:
    name: home-assistant-config-legacy-pv
spec:
    capacity:
        storage: 1Gi
    accessModes:
        - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    storageClassName: ""
    mountOptions:
        - nfsvers=3
    nfs:
        server: 192.168.1.155
        path: /mnt/fast/1tb/services/home-automation-home-assistant-config-pvc-14874a39-fe7f-4cd8-80e4-2da9d852e3c6
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: home-assistant-config-legacy
    namespace: home-automation
spec:
    storageClassName: ""
    volumeName: home-assistant-config-legacy-pv
    accessModes:
        - ReadWriteMany
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: home-assistant-time-pvc
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 1Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
    name: home-assistant-time-pv
spec:
    capacity:
        storage: 1Mi
    accessModes:
        - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain
    hostPath:
        path: /etc/localtime
    claimRef:
        name: home-assistant-time-pvc
        namespace: home-automation
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: home-assistant-http-config
    namespace: home-automation
data:
    http.json: |
        {
          "use_x_forwarded_for": true,
          "trusted_proxies": [
            "10.42.0.0/16",
            "127.0.0.1/32",
            "::1/128"
          ]
        }
    configure-http.py: |
        import datetime
        import json
        import os
        import tempfile
        from pathlib import Path

        config_dir = Path("/config")
        storage_dir = config_dir / ".storage"
        storage_path = storage_dir / "http"
        proxy_config = json.loads((Path("/tmp/http-config") / "http.json").read_text())

        if storage_path.exists():
            document = json.loads(storage_path.read_text())
        else:
            document = {
                "version": 2,
                "minor_version": 2,
                "key": "http",
                "data": {},
            }

        data = document.setdefault("data", {})
        if not isinstance(data.get("stable"), dict):
            legacy_config = dict(data)
            document["minor_version"] = 2
            data = document["data"] = {"stable": legacy_config}
        stable = data.get("stable") or {
            "server_port": 8123,
            "cors_allowed_origins": ["https://cast.home-assistant.io"],
            "login_attempts_threshold": -1,
            "ip_ban_enabled": True,
            "ssl_profile": "modern",
            "use_x_frame_options": True,
            "created_at": datetime.datetime.now(datetime.UTC).isoformat(),
            "error": None,
            "error_message": None,
        }
        stable.update(proxy_config)
        stable["error"] = None
        stable["error_message"] = None
        data["stable"] = stable
        data["pending"] = None
        data["yaml_migration_done"] = True
        document["version"] = 2
        document["minor_version"] = 2
        document["key"] = "http"

        storage_dir.mkdir(parents=True, exist_ok=True)
        with tempfile.NamedTemporaryFile(
            mode="w", encoding="utf-8", dir=storage_dir, delete=False
        ) as temporary:
            json.dump(document, temporary, indent=2, sort_keys=True)
            temporary.write("\n")
            temporary_path = temporary.name
        os.replace(temporary_path, storage_path)

        generated_yaml = """http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.42.0.0/16
            - 127.0.0.1
            - ::1
        """
        yaml_path = config_dir / "configuration.yaml"
        if yaml_path.exists() and yaml_path.read_text().strip() == generated_yaml.strip():
            yaml_path.write_text("")
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: home-assistant
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: home-assistant
    template:
        metadata:
            labels:
                app: home-assistant
        spec:
            tolerations:
                - key: node-role.kubernetes.io/control-plane
                  effect: NoSchedule
            nodeSelector:
                node-role.kubernetes.io/control-plane: "true"
            initContainers:
                - name: configure-http
                  image: "ghcr.io/home-assistant/home-assistant:stable"
                  command: ["python3", "/tmp/http-config/configure-http.py"]
                  volumeMounts:
                      - mountPath: /config
                        name: home-assistant-config
                      - mountPath: /tmp/http-config
                        name: http-config
            containers:
                - name: matter-server
                  image: ghcr.io/matter-js/python-matter-server:stable
                  securityContext:
                      privileged: true
                  volumeMounts:
                      - mountPath: /data
                        name: home-assistant-config
                        subPath: matter-server
                - name: home-assistant
                  image: "ghcr.io/home-assistant/home-assistant:stable"
                  securityContext:
                      privileged: true
                  ports:
                      - name: http
                        containerPort: 8123
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /config
                        name: home-assistant-config
                      - mountPath: /etc/localtime
                        name: home-assistant-time
                        readOnly: true
            hostNetwork: true
            volumes:
                - name: home-assistant-config
                  persistentVolumeClaim:
                      claimName: home-assistant-config-legacy
                - name: http-config
                  configMap:
                      name: home-assistant-http-config
                - name: home-assistant-time
                  persistentVolumeClaim:
                      claimName: home-assistant-time-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: home-assistant
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    selector:
        app: home-assistant
    ports:
        - name: http
          port: 8123
          targetPort: 8123
          protocol: TCP
    type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: home-assistant-route
    namespace: home-automation
    annotations:
        gethomepage.dev/description: Home automation
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Home
        gethomepage.dev/href: https://ha.clorofilla.casa
        gethomepage.dev/icon: home-assistant.png
        gethomepage.dev/name: Home Assistant
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`ha.clorofilla.casa`)
          priority: 10
          services:
              - name: home-assistant
                port: 8123
    tls:
        certResolver: default
