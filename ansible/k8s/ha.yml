apiVersion: v1
kind: Namespace
metadata:
    name: home-automation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: home-assistant-config
    namespace: home-automation
spec:
    storageClassName: nfs-client
    accessModes:
        - ReadWriteMany
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: home-assistant-time-pvc
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 1Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
    name: home-assistant-time-pv
spec:
    capacity:
        storage: 1Mi
    accessModes:
        - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain
    hostPath:
        path: /etc/localtime
    claimRef:
        name: home-assistant-time-pvc
        namespace: home-automation
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: home-assistant-http-config
    namespace: home-automation
data:
    http.yaml: |
        http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.42.0.0/16
            - 127.0.0.1
            - ::1
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: home-assistant
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    replicas: 1
    selector:
        matchLabels:
            app: home-assistant
    template:
        metadata:
            labels:
                app: home-assistant
        spec:
            tolerations:
                - key: node-role.kubernetes.io/control-plane
                  effect: NoSchedule
            nodeSelector:
                node-role.kubernetes.io/control-plane: "true"
            initContainers:
                - name: copy-config
                  image: busybox:latest
                  command: ["sh", "-c"]
                  args:
                      - |
                          grep -q "^http:" /config/configuration.yaml || { echo "" >> /config/configuration.yaml; cat /tmp/http-config/http.yaml >> /config/configuration.yaml; }
                          echo "Config file copied"
                  volumeMounts:
                      - mountPath: /config
                        name: home-assistant-config
                      - mountPath: /tmp/http-config
                        name: http-config
            containers:
                - name: matter-server
                  image: ghcr.io/matter-js/python-matter-server:stable
                  securityContext:
                      privileged: true
                      volumeMounts:
                          - mountPath: /data
                            name: home-assistant-config
                            subDir: matter-server
                - name: home-assistant
                  image: "ghcr.io/home-assistant/home-assistant:stable"
                  securityContext:
                      privileged: true
                  ports:
                      - name: http
                        containerPort: 8123
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /config
                        name: home-assistant-config
                      - mountPath: /etc/localtime
                        name: home-assistant-time
                        readOnly: true
            hostNetwork: true
            volumes:
                - name: home-assistant-config
                  persistentVolumeClaim:
                      claimName: home-assistant-config
                - name: http-config
                  configMap:
                      name: home-assistant-http-config
                - name: home-assistant-time
                  persistentVolumeClaim:
                      claimName: home-assistant-time-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: home-assistant
    namespace: home-automation
    labels:
        app: home-assistant
spec:
    selector:
        app: home-assistant
    ports:
        - name: http
          port: 8123
          targetPort: 8123
          protocol: TCP
    type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: home-assistant-route
    namespace: home-automation
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`ha.clorofilla.casa`)
          priority: 10
          services:
              - name: home-assistant
                port: 8123
    tls:
        certResolver: default
