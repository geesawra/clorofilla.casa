---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: immich-ml
    namespace: immich
    labels:
        app: immich-ml
spec:
    replicas: 1
    selector:
        matchLabels:
            app: immich-ml
    template:
        metadata:
            labels:
                app: immich-ml
        spec:
            nodeSelector:
                kubernetes.io/hostname: reform
            containers:
                - name: immich-ml
                  image: ghcr.io/immich-app/immich-machine-learning:v2.4.1-rknn
                  securityContext:
                      privileged: true
                  ports:
                      - containerPort: 3003
                        protocol: TCP
                  env:
                      - name: TRANSFORMERS_CACHE
                        value: /cache
                      - name: HF_XET_CACHE
                        value: /cache/huggingface-xet
                      - name: MPLCONFIGDIR
                        value: /cache/matplotlib-config
                      - name: MACHINE_LEARNING_RKNN_THREADS
                        value: "3"
                  volumeMounts:
                      - mountPath: /cache
                        name: cache
                      - mountPath: /dev/dri
                        name: dev-dri
                      - mountPath: /proc/device-tree
                        name: device-tree
            volumes:
                - name: cache
                  persistentVolumeClaim:
                      claimName: immich-ml-pvc
                - name: dev-dri
                  hostPath:
                      path: /dev/dri
                - name: device-tree
                  hostPath:
                      path: /proc/device-tree
---
apiVersion: v1
kind: Service
metadata:
    name: immich-ml
    namespace: immich
spec:
    type: ClusterIP
    selector:
        app: immich-ml
    ports:
        - protocol: TCP
          name: http
          port: 3003
          targetPort: 3003
