apiVersion: v1
kind: Namespace
metadata:
    name: torrents
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: flaresolverr-deployment
    namespace: torrents
    labels:
        app: flaresolverr
spec:
    replicas: 1
    selector:
        matchLabels:
            app: flaresolverr
    template:
        metadata:
            labels:
                app: flaresolverr
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            containers:
                - name: flaresolverr-container
                  image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
                  ports:
                      - containerPort: 8191
                        protocol: TCP
                  env:
                      - name: HOST
                        value: "0.0.0.0"
                      - name: TZ
                        value: "Europe/Rome"
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 8191
                      initialDelaySeconds: 5
                      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: flaresolverr-service
    namespace: torrents
spec:
    type: ClusterIP
    selector:
        app: flaresolverr
    ports:
        - protocol: TCP
          name: http
          port: 8191
          targetPort: 8191
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: flaresolverr-only-jackett
    namespace: torrents
spec:
    podSelector:
        matchLabels:
            app: flaresolverr
    policyTypes:
        - Ingress
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app: jackett
          ports:
              - protocol: TCP
                port: 8191
