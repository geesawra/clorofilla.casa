---
# Prometheus config
apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
    namespace: monitoring
data:
    prometheus.yml: |
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: node-exporter
            static_configs:
              - targets: ['bfg:9100']
                labels:
                  instance: bfg
          - job_name: kube-state-metrics
            static_configs:
              - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
          - job_name: k3s-kubelet
            static_configs:
              - targets: ['bfg:10255']
                labels:
                  instance: bfg
            metric_relabel_configs:
              - action: drop
                source_labels: [__name__]
                regex: 'container_(cpu|memory|network|fs|pids)_.*'
---
# Prometheus data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: prometheus-data
    namespace: monitoring
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 100Gi
---
# Prometheus deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: prometheus
    namespace: monitoring
    labels:
        app: prometheus
spec:
    replicas: 1
    selector:
        matchLabels:
            app: prometheus
    template:
        metadata:
            labels:
                app: prometheus
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            # Prometheus uses host networking so LAN clients can reach its dedicated host port 9092.
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            containers:
                - name: prometheus
                  image: prom/prometheus:v3.12.0
                  args:
                      - "--config.file=/etc/prometheus/prometheus.yml"
                      - "--storage.tsdb.path=/prometheus"
                      - "--storage.tsdb.retention.time=365d"
                      # Port 9090 is used by Cockpit on the host; keep host networking for LAN clients.
                      - "--web.listen-address=:9092"
                  ports:
                      - containerPort: 9092
                  volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                      - name: data
                        mountPath: /prometheus
            volumes:
                - name: config
                  configMap:
                      name: prometheus-config
                - name: data
                  persistentVolumeClaim:
                      claimName: prometheus-data
---
# Prometheus service
apiVersion: v1
kind: Service
metadata:
    name: prometheus
    namespace: monitoring
spec:
    type: ClusterIP
    selector:
        app: prometheus
    ports:
        - name: http
          port: 9090
          targetPort: 9092
---
# IngressRoute for prometheus.clorofilla.casa
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: prometheus-route
    namespace: monitoring
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`prometheus.clorofilla.casa`)
          priority: 10
          services:
              - name: prometheus
                port: 9090
    tls:
        certResolver: default
