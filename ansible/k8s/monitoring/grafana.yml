---
# Datasource provisioning is generated by the initializer to preserve its UID.
# Grafana dashboard provisioning config
apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboards-config
    namespace: monitoring
data:
    dashboards.yaml: |
        apiVersion: 1
        providers:
          - name: default
            folder: ''
            type: file
            disableDeletion: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards
---
# Grafana data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: grafana-data
    namespace: monitoring
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
---
# Grafana deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: grafana
    namespace: monitoring
    labels:
        app: grafana
spec:
    replicas: 1
    # Stop the old instance before inspecting and reopening its SQLite database.
    strategy:
        type: Recreate
        rollingUpdate: null
    selector:
        matchLabels:
            app: grafana
    template:
        metadata:
            labels:
                app: grafana
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            initContainers:
                - name: prepare-dashboards
                  image: python:3.13.5-slim
                  command:
                      - python
                      - /scripts/prepare_dashboards.py
                      - --output-dir
                      - /dashboards
                      - --database
                      - /existing-data/grafana.db
                      - --datasource-config-dir
                      - /datasources
                  volumeMounts:
                      - name: dashboard-preparer
                        mountPath: /scripts/prepare_dashboards.py
                        subPath: prepare_dashboards.py
                        readOnly: true
                      - name: dashboards-json
                        mountPath: /dashboards
                      - name: data
                        mountPath: /existing-data
                        readOnly: true
                      - name: datasources
                        mountPath: /datasources
            containers:
                - name: grafana
                  image: grafana/grafana:13.0.2
                  env:
                      - name: GF_SERVER_ROOT_URL
                        value: https://grafana.clorofilla.casa
                  ports:
                      - containerPort: 3000
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 5
                      failureThreshold: 60
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 5
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/grafana
                      - name: datasources
                        mountPath: /etc/grafana/provisioning/datasources
                      - name: dashboards-config
                        mountPath: /etc/grafana/provisioning/dashboards/default.yaml
                        subPath: dashboards.yaml
                      - name: dashboards-json
                        mountPath: /var/lib/grafana/dashboards
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: grafana-data
                - name: datasources
                  emptyDir: {}
                - name: dashboards-config
                  configMap:
                      name: grafana-dashboards-config
                - name: dashboard-preparer
                  configMap:
                      name: grafana-dashboard-preparer
                      items:
                          - key: prepare_dashboards.py
                            path: prepare_dashboards.py
                - name: dashboards-json
                  emptyDir: {}
---
# Grafana service
apiVersion: v1
kind: Service
metadata:
    name: grafana
    namespace: monitoring
spec:
    type: ClusterIP
    selector:
        app: grafana
    ports:
        - name: http
          port: 3000
          targetPort: 3000
---
# IngressRoute for grafana.clorofilla.casa
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: grafana-route
    namespace: monitoring
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`grafana.clorofilla.casa`)
          priority: 10
          services:
              - name: grafana
                port: 3000
    tls:
        certResolver: default
