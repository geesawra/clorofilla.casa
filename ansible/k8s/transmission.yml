apiVersion: v1
kind: Namespace
metadata:
    name: torrents
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: transmission-tracker-sort-script
    namespace: torrents
data:
    route_by_tracker.py: |
        #!/usr/bin/env python3
        import os
        import subprocess
        import sys
        from urllib.parse import urlsplit

        tracker_hosts = set()
        for announce_url in os.environ.get("TR_TORRENT_TRACKERS", "").split(","):
            try:
                host = urlsplit(announce_url.strip()).hostname
            except ValueError:
                continue
            if host:
                tracker_hosts.add(host.lower().rstrip("."))

        categories = set()
        for host in tracker_hosts:
            if host == "t.myanonamouse.net" or host.endswith(".myanonamouse.net"):
                categories.add("mouse")
            elif host in {"flacsfor.me", "redacted.ch"} or host.endswith(".redacted.ch"):
                categories.add("red")

        if len(categories) != 1:
            sys.exit(0)

        torrent_id = os.environ.get("TR_TORRENT_ID", "")
        if not torrent_id.isdigit():
            sys.exit("Missing or invalid TR_TORRENT_ID")

        destination = f"/downloads/complete/{categories.pop()}"
        current_directory = os.path.normpath(os.environ.get("TR_TORRENT_DIR", ""))
        if current_directory == destination:
            sys.exit(0)

        os.makedirs(destination, exist_ok=True)
        subprocess.run(
            ["transmission-remote", "127.0.0.1:9091", "--torrent", torrent_id, "--move", destination],
            check=True,
            stdout=subprocess.DEVNULL,
        )
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: transmission-deployment
    namespace: torrents
    labels:
        app: transmission
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: transmission
    template:
        metadata:
            name: transmission-pod
            namespace: torrents
            labels:
                app: transmission
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            initContainers:
                - name: configure-tracker-sort-hook
                  image: ghcr.io/linuxserver/transmission:4.0.6
                  command:
                      - /bin/sh
                      - -ec
                  args:
                      - |
                          jq '."script-torrent-done-enabled" = true | ."script-torrent-done-filename" = "/scripts/route_by_tracker.py"' /config/settings.json > /config/settings.json.tmp
                          mv /config/settings.json.tmp /config/settings.json
                  securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                  volumeMounts:
                      - mountPath: /config
                        name: config
            containers:
                - name: transmission-container
                  image: ghcr.io/linuxserver/transmission:4.0.6
                  ports:
                      - containerPort: 9091
                        protocol: TCP
                      - containerPort: 51413
                        protocol: TCP
                      - containerPort: 51413
                        protocol: UDP

                  volumeMounts:
                      - mountPath: /downloads
                        name: files
                      - mountPath: /config
                        name: config
                      - mountPath: /scripts/route_by_tracker.py
                        name: tracker-sort-script
                        subPath: route_by_tracker.py
                        readOnly: true

                  env:
                      - name: PUID
                        value: "1000"
                      - name: PGID
                        value: "1000"
                      - name: TZ
                        value: "Europe/Rome"

            volumes:
                - name: config
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/config

                - name: tracker-sort-script
                  configMap:
                      name: transmission-tracker-sort-script
                      defaultMode: 493

                - name: files
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/files
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-service
    namespace: torrents
spec:
    type: NodePort
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: web-interface
          port: 9091
          targetPort: 9091
        - protocol: TCP
          name: torrent-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: torrents-udp
          port: 51413
          targetPort: 51413
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: transmission-mine-route
    namespace: torrents
    annotations:
        gethomepage.dev/description: Torrent downloads
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Media
        gethomepage.dev/href: https://transmission.clorofilla.casa
        gethomepage.dev/icon: transmission.png
        gethomepage.dev/name: Transmission
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`transmission.clorofilla.casa`)
          priority: 10
          services:
              - name: transmission-service
                port: 9091
    tls:
        certResolver: default
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-peer-lb
    namespace: torrents
spec:
    type: LoadBalancer
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: peer-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: peer-udp
          port: 51413
          targetPort: 51413
