apiVersion: v1
kind: Namespace
metadata:
    name: torrents
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: transmission-deployment
    namespace: torrents
    labels:
        app: transmission
spec:
    replicas: 1
    selector:
        matchLabels:
            app: transmission
    template:
        metadata:
            name: transmission-pod
            namespace: torrents
            labels:
                app: transmission
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            containers:
                - name: transmission-container
                  image: ghcr.io/linuxserver/transmission:4.0.6
                  ports:
                      - containerPort: 9091
                        protocol: TCP
                      - containerPort: 51413
                        protocol: TCP
                      - containerPort: 51413
                        protocol: UDP

                  volumeMounts:
                      - mountPath: /downloads
                        name: files
                      - mountPath: /config
                        name: config

                  env:
                      - name: PUID
                        value: "1000"
                      - name: PGID
                        value: "1000"
                      - name: TZ
                        value: "Europe/Rome"

            volumes:
                - name: config
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/config

                - name: files
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/files
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-service
    namespace: torrents
spec:
    type: NodePort
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: web-interface
          port: 9091
          targetPort: 9091
        - protocol: TCP
          name: torrent-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: torrents-udp
          port: 51413
          targetPort: 51413
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: transmission-mine-route
    namespace: torrents
    annotations:
        gethomepage.dev/description: Torrent downloads
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Media
        gethomepage.dev/href: https://transmission.clorofilla.casa
        gethomepage.dev/icon: transmission.png
        gethomepage.dev/name: Transmission
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`transmission.clorofilla.casa`)
          priority: 10
          services:
              - name: transmission-service
                port: 9091
    tls:
        certResolver: default
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-peer-lb
    namespace: torrents
spec:
    type: LoadBalancer
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: peer-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: peer-udp
          port: 51413
          targetPort: 51413
