apiVersion: v1
kind: Namespace
metadata:
    name: torrents
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: transmission-tracker-sort-script
    namespace: torrents
data:
    route_by_tracker.py: |
        #!/usr/bin/env python3
        import argparse
        import json
        import os
        import subprocess
        import sys
        from datetime import datetime
        from urllib.error import HTTPError
        from urllib.parse import urlsplit
        from urllib.request import Request, urlopen

        def log(message):
            line = f"{datetime.now().astimezone().isoformat(timespec='seconds')} {message}\n"
            try:
                with open("/config/route_by_tracker.log", "a", encoding="utf-8") as log_file:
                    log_file.write(line)
            except OSError as error:
                print(f"tracker routing log failed: {type(error).__name__}", file=sys.stderr)

        def tracker_hosts(announce_urls):
            hosts = set()
            for announce_url in announce_urls:
                try:
                    host = urlsplit(announce_url.strip()).hostname
                except ValueError:
                    continue
                if host:
                    hosts.add(host.lower().rstrip("."))
            return hosts

        def categories_for(hosts):
            categories = set()
            for host in hosts:
                if host == "t.myanonamouse.net" or host.endswith(".myanonamouse.net"):
                    categories.add("mouse")
                elif host in {"flacsfor.me", "redacted.ch"} or host.endswith(".redacted.ch"):
                    categories.add("red")
            return categories

        def rpc_torrent(torrent_id):
            payload = json.dumps({
                "method": "torrent-get",
                "arguments": {"ids": [int(torrent_id)], "fields": ["id", "trackerStats", "downloadDir"]},
            }).encode()

            def request(session_id=None):
                headers = {"Content-Type": "application/json"}
                if session_id:
                    headers["X-Transmission-Session-Id"] = session_id
                req = Request("http://127.0.0.1:9091/transmission/rpc", data=payload, headers=headers)
                try:
                    with urlopen(req, timeout=5) as response:
                        return json.load(response)
                except HTTPError as error:
                    if error.code != 409:
                        raise
                    next_session_id = error.headers.get("X-Transmission-Session-Id")
                    if not next_session_id:
                        raise
                    return request(next_session_id)

            torrents = request().get("arguments", {}).get("torrents", [])
            return torrents[0] if torrents else None

        parser = argparse.ArgumentParser(description="Route completed torrents by tracker")
        parser.add_argument("--dry-run", action="store_true", help="show the routing decision without moving data")
        parser.add_argument("--torrent-id", help="inspect a torrent by ID (requires --dry-run)")
        args = parser.parse_args()
        dry_run = args.dry_run or os.environ.get("ROUTE_BY_TRACKER_DRY_RUN", "").lower() in {"1", "true", "yes"}
        if args.torrent_id and not dry_run:
            parser.error("--torrent-id requires --dry-run")

        torrent_id = (args.torrent_id or os.environ.get("TR_TORRENT_ID", "")).strip()
        if not torrent_id.isdigit():
            if dry_run:
                parser.error("--dry-run requires TR_TORRENT_ID or --torrent-id")
            log("skip reason=invalid-torrent-id")
            sys.exit("Missing or invalid TR_TORRENT_ID")

        torrent = None
        if args.torrent_id:
            try:
                torrent = rpc_torrent(torrent_id)
            except Exception as error:
                print(f"Could not inspect torrent {torrent_id}: {type(error).__name__}", file=sys.stderr)
                sys.exit(1)
            if not torrent:
                print(f"Torrent {torrent_id} was not found", file=sys.stderr)
                sys.exit(1)
            hosts = tracker_hosts(
                tracker.get("announce", "")
                for tracker in torrent.get("trackerStats", [])
            )
        else:
            tracker_urls = os.environ.get("TR_TORRENT_TRACKERS", "").replace("\n", ",").split(",")
            hosts = tracker_hosts(tracker_urls)

        categories = categories_for(hosts)
        if len(categories) != 1 and not torrent:
            try:
                torrent = rpc_torrent(torrent_id)
                if torrent:
                    hosts = tracker_hosts(
                        tracker.get("announce", "")
                        for tracker in torrent.get("trackerStats", [])
                    )
                    categories = categories_for(hosts)
            except Exception as error:
                if dry_run:
                    print(f"Could not inspect trackers for torrent {torrent_id}: {type(error).__name__}", file=sys.stderr)
                    sys.exit(1)
                log(f"tracker lookup failed id={torrent_id} error={type(error).__name__}")

        if len(categories) != 1:
            message = f"skip id={torrent_id} reason=unmatched-or-ambiguous trackers={','.join(sorted(hosts))}"
            if dry_run:
                log(f"dry-run {message}")
                print(f"DRY RUN: {message}")
            else:
                log(message)
            sys.exit(0)

        category = categories.pop()
        destination = f"/downloads/complete/{category}"
        current_path = os.environ.get("TR_TORRENT_DIR") or (torrent or {}).get("downloadDir", "")
        current_directory = os.path.normpath(current_path)
        if current_directory == destination:
            message = f"id={torrent_id} category={category} source={current_directory} destination={destination} action=already-routed"
            if dry_run:
                log(f"dry-run {message}")
                print(f"DRY RUN: {message}")
            else:
                log(f"skip {message}")
            sys.exit(0)

        if dry_run:
            message = f"id={torrent_id} category={category} source={current_directory or 'unknown'} destination={destination} action=would-move"
            log(f"dry-run {message}")
            print(f"DRY RUN: {message}")
            sys.exit(0)

        try:
            os.makedirs(destination, exist_ok=True)
            subprocess.run(
                ["transmission-remote", "127.0.0.1:9091", "--torrent", torrent_id, "--move", destination],
                check=True,
                stdout=subprocess.DEVNULL,
            )
        except Exception as error:
            log(f"move failed id={torrent_id} category={category} error={type(error).__name__}")
            raise
        log(f"moved id={torrent_id} category={category}")
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: transmission-deployment
    namespace: torrents
    labels:
        app: transmission
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: transmission
    template:
        metadata:
            name: transmission-pod
            namespace: torrents
            labels:
                app: transmission
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            initContainers:
                - name: configure-tracker-sort-hook
                  image: ghcr.io/linuxserver/transmission:4.0.6
                  command:
                      - /bin/sh
                      - -ec
                  args:
                      - |
                          jq '."script-torrent-done-enabled" = true | ."script-torrent-done-filename" = "/scripts/route_by_tracker.py"' /config/settings.json > /config/settings.json.tmp
                          mv /config/settings.json.tmp /config/settings.json
                  securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                  volumeMounts:
                      - mountPath: /config
                        name: config
            containers:
                - name: transmission-container
                  image: ghcr.io/linuxserver/transmission:4.0.6
                  ports:
                      - containerPort: 9091
                        protocol: TCP
                      - containerPort: 51413
                        protocol: TCP
                      - containerPort: 51413
                        protocol: UDP

                  volumeMounts:
                      - mountPath: /downloads
                        name: files
                      - mountPath: /config
                        name: config
                      - mountPath: /scripts
                        name: tracker-sort-script
                        readOnly: true

                  env:
                      - name: PUID
                        value: "1000"
                      - name: PGID
                        value: "1000"
                      - name: TZ
                        value: "Europe/Rome"

            volumes:
                - name: config
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/config

                - name: tracker-sort-script
                  configMap:
                      name: transmission-tracker-sort-script
                      defaultMode: 493

                - name: files
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/torrents/mine/files
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-service
    namespace: torrents
spec:
    type: NodePort
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: web-interface
          port: 9091
          targetPort: 9091
        - protocol: TCP
          name: torrent-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: torrents-udp
          port: 51413
          targetPort: 51413
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: transmission-mine-route
    namespace: torrents
    annotations:
        gethomepage.dev/description: Torrent downloads
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Media
        gethomepage.dev/href: https://transmission.clorofilla.casa
        gethomepage.dev/icon: transmission.png
        gethomepage.dev/name: Transmission
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`transmission.clorofilla.casa`)
          priority: 10
          services:
              - name: transmission-service
                port: 9091
    tls:
        certResolver: default
---
kind: Service
apiVersion: v1
metadata:
    name: transmission-peer-lb
    namespace: torrents
spec:
    type: LoadBalancer
    selector:
        app: transmission
    ports:
        - protocol: TCP
          name: peer-tcp
          port: 51413
          targetPort: 51413
        - protocol: UDP
          name: peer-udp
          port: 51413
          targetPort: 51413
