apiVersion: v1
kind: Namespace
metadata:
    name: navidrome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: navidrome-data
    namespace: navidrome
spec:
    storageClassName: nfs-client
    accessModes:
        - ReadWriteMany
    resources:
        requests:
            storage: 1Gi
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: navidrome-deployment
    namespace: navidrome
    labels:
        app: navidrome
spec:
    replicas: 1
    selector:
        matchLabels:
            app: navidrome
    template:
        metadata:
            name: navidrome-pod
            namespace: navidrome
            labels:
                app: navidrome
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            securityContext:
                fsGroup: 1000
            initContainers:
                - name: remove-audiomuse-plugin
                  image: busybox:latest
                  command:
                      - sh
                      - -c
                      - rm -f /data/plugins/audiomuseai.ndp
                  volumeMounts:
                      - mountPath: /data
                        name: data
            containers:
                - name: navidrome-container
                  image: deluan/navidrome:latest
                  ports:
                      - containerPort: 4533
                        protocol: TCP

                  volumeMounts:
                      - mountPath: /data
                        name: data
                      - mountPath: /music/old
                        name: music-old
                        readOnly: true
                      - mountPath: /music/mine
                        name: music-mine
                        readOnly: true

                  env:
                      - name: ND_LOGLEVEL
                        value: info
                      - name: ND_ENABLETRANSCODINGCONFIG
                        value: "true"
                      - name: ND_BASEURL
                        value: https://navidrome.clorofilla.casa
                      - name: ND_ENABLESHARING
                        value: "true"
                      - name: ND_PLUGINS_ENABLED
                        value: "true"
                      - name: ND_PLUGINS_AUTORELOAD
                        value: "true"
                      - name: ND_AGENTS
                        value: "lastfm,spotify,deezer"

            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: navidrome-data

                - name: music-old
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/main/data/usb-disk-1/Music
                      readOnly: true

                - name: music-mine
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/torrents/data/mine/files/complete
                      readOnly: true
---
kind: Service
apiVersion: v1
metadata:
    name: navidrome-service
    namespace: navidrome
spec:
    type: ClusterIP
    selector:
        app: navidrome
    ports:
        - protocol: TCP
          name: http
          port: 4533
          targetPort: 4533
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: navidrome-route
    namespace: navidrome
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`navidrome.clorofilla.casa`)
          priority: 10
          services:
              - name: navidrome-service
                port: 4533
    tls:
        certResolver: default
