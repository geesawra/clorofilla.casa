server:
  persistence:
    existing-uploads:
      enabled: true
      existingClaim: previous-immich-uploads-pvc
      globalMounts: [{ readOnly: true }]

    external:
      enabled: true
      existingClaim: immich-camera-photos-pvc
      globalMounts: [{ readOnly: true }]

  controllers:
    main:
      rollingUpdate:
        surge: "0"
        unavailable: 1
      pod:
        nodeSelector:
          kubernetes.io/hostname: bfg
        resourceClaims:
          - name: gpu
            resourceClaimTemplateName: immich-server-raphael-gpu-v1
        securityContext:
          supplementalGroups:
            - 39
            - 105
      containers:
        main:
          image:
            tag: v3.1.0
          resources:
            claims:
              - name: gpu
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: Unconfined
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname
            IMMICH_MACHINE_LEARNING_URL:
              value: http://immich-machine-learning:3003
valkey:
  enabled: true
immich:
  configuration:
    ffmpeg:
      accel: vaapi
      accelDecode: true
      transcode: disabled
      acceptedVideoCodecs:
        - h264
        - hevc
      acceptedAudioCodecs:
        - aac
        - mp3
        - opus
        - pcm_s16le
      realtime:
        enabled: true
        videoCodecs:
          - h264
          - hevc
        resolutions:
          - 480
          - 720
          - 1080
    machineLearning:
      ocr:
        enabled: true
        modelName: PP-OCRv5_server
        minDetectionScore: 0.5
        minRecognitionScore: 0.8
        maxResolution: 736
  persistence:
    library:
      existingClaim: immich-data-pvc
machine-learning:
  enabled: true
  controllers:
    main:
      rollingUpdate:
        surge: "0"
        unavailable: 1
      pod:
        nodeSelector:
          kubernetes.io/hostname: bfg
        hostIPC: true
        resourceClaims:
          - name: gpu
            resourceClaimTemplateName: immich-ml-rx6950xt-gpu-v1
        securityContext:
          supplementalGroups:
            - 39
            - 105
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.1.0-rocm
          resources:
            claims:
              - name: gpu
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: Unconfined
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
            HSA_USE_SVM: "0"
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteMany
      storageClass: nfs-client
