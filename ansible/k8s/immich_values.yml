server:
    persistence:
        existing-uploads:
            enabled: true
            existingClaim: previous-immich-uploads-pvc
            globalMounts: [{readOnly: true}]

        external:
            enabled: true
            existingClaim: immich-camera-photos-pvc
            globalMounts: [{readOnly: true}]

    controllers:
        main:
            containers:
                main:
                    image:
                        tag: v3.0.2
                    env:
                        DB_HOSTNAME:
                            valueFrom:
                                secretKeyRef:
                                    name: immich-database-app
                                    key: host
                        DB_USERNAME:
                            valueFrom:
                                secretKeyRef:
                                    name: immich-database-app
                                    key: user
                        DB_PASSWORD:
                            valueFrom:
                                secretKeyRef:
                                    name: immich-database-app
                                    key: password
                        DB_DATABASE_NAME:
                            valueFrom:
                                secretKeyRef:
                                    name: immich-database-app
                                    key: dbname
                        IMMICH_MACHINE_LEARNING_URL:
                            value: >-
                                http://immich-ml.immich.svc.cluster.local:3003
valkey:
    enabled: true
immich:
    persistence:
        library:
            existingClaim: immich-data-pvc
machine-learning:
    enabled: false  # deployed as standalone pod on reform
