apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    gethomepage.dev/description: GitOps deployment management
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/href: https://argocd.clorofilla.casa
    gethomepage.dev/icon: argocd.png
    gethomepage.dev/name: Argo CD
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.clorofilla.casa`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.clorofilla.casa`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    certResolver: default
