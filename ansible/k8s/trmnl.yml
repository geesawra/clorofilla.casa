apiVersion: v1
kind: Namespace
metadata:
  name: trmnl
---
apiVersion: v1
kind: Secret
metadata:
  name: trmnl-config
  namespace: trmnl
type: Opaque
stringData:
  APP_SECRET: "6897a13b-0dbd-43a3-9e31-3ee585b0c7b2a1b8d092-5bc5-4cdf-b553-66cd2853db22"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trmnl-database
  namespace: trmnl
spec:
  instances: 1
  storage:
    size: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trmnl-keyvalue-data
  namespace: trmnl
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trmnl-web-uploads
  namespace: trmnl
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: trmnl-keyvalue
  namespace: trmnl
  labels:
    app: trmnl-keyvalue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trmnl-keyvalue
  template:
    metadata:
      labels:
        app: trmnl-keyvalue
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          command:
            - valkey-server
            - --requirepass
            - valkey
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction
            - --port
            - "6379"
          volumeMounts:
            - mountPath: /data
              name: keyvalue-data
          resources:
            limits:
              memory: 512Mi
              cpu: "0.5"
      volumes:
        - name: keyvalue-data
          persistentVolumeClaim:
            claimName: trmnl-keyvalue-data
---
kind: Service
apiVersion: v1
metadata:
  name: trmnl-keyvalue
  namespace: trmnl
spec:
  type: ClusterIP
  selector:
    app: trmnl-keyvalue
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: trmnl-web
  namespace: trmnl
  labels:
    app: trmnl-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trmnl-web
  template:
    metadata:
      labels:
        app: trmnl-web
    spec:
      containers:
        - name: web
          image: ghcr.io/usetrmnl/terminus:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: HANAMI_PORT
              value: "8080"
            - name: API_URI
              value: "https://trmnl.clorofilla.casa"
            - name: APP_SETUP
              value: "true"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: trmnl-config
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trmnl-database-app
                  key: uri
            - name: KEYVALUE_URL
              value: "redis://:valkey@trmnl-keyvalue:6379/0"
          volumeMounts:
            - mountPath: /app/public/uploads
              name: web-uploads
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
      volumes:
        - name: web-uploads
          persistentVolumeClaim:
            claimName: trmnl-web-uploads
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: trmnl-worker
  namespace: trmnl
  labels:
    app: trmnl-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trmnl-worker
  template:
    metadata:
      labels:
        app: trmnl-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/usetrmnl/terminus:latest
          command: ["bundle", "exec", "sidekiq", "-r", "./config/sidekiq.rb"]
          env:
            - name: HANAMI_PORT
              value: "8080"
            - name: API_URI
              value: "https://trmnl.clorofilla.casa"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: trmnl-config
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trmnl-database-app
                  key: uri
            - name: KEYVALUE_URL
              value: "redis://:valkey@trmnl-keyvalue:6379/0"
          volumeMounts:
            - mountPath: /app/public/uploads
              name: web-uploads
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
      volumes:
        - name: web-uploads
          persistentVolumeClaim:
            claimName: trmnl-web-uploads
---
kind: Service
apiVersion: v1
metadata:
  name: trmnl-web
  namespace: trmnl
spec:
  type: ClusterIP
  selector:
    app: trmnl-web
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trmnl-route
  namespace: trmnl
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`trmnl.clorofilla.casa`)
      priority: 10
      services:
        - name: trmnl-web
          port: 8080
  tls:
    certResolver: default
