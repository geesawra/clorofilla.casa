  name: previous-immich-uploads-hdd-pvc
  namespace: immich
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  volumeName: previous-immich-uploads-hdd
