apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiomuse-route
  namespace: navidrome
  annotations:
    gethomepage.dev/description: AI music discovery
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Music
    gethomepage.dev/href: https://audiomuse.clorofilla.casa
    gethomepage.dev/name: AudioMuse AI
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`audiomuse.clorofilla.casa`)
      priority: 10
      services:
        - name: audiomuse-audiomuse-ai-flask-service
          port: 8000
  tls:
    certResolver: default
