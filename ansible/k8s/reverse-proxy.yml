apiVersion: v1
kind: Namespace
metadata:
    name: reverse-proxy
---
apiVersion: v1
kind: Service
metadata:
    name: truenas
    namespace: reverse-proxy
spec:
    ports:
        - port: 80
          targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
    name: truenas
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.155
      ports:
          - port: 80
---
apiVersion: v1
kind: Service
metadata:
    name: zerobyte
    namespace: reverse-proxy
spec:
    ports:
        - port: 30314
          targetPort: 30314
---
apiVersion: v1
kind: Endpoints
metadata:
    name: zerobyte
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.155
      ports:
          - port: 30314
---
apiVersion: v1
kind: Service
metadata:
    name: almalinux-webui
    namespace: reverse-proxy
spec:
    ports:
        - port: 9090
          targetPort: 9090
---
apiVersion: v1
kind: Endpoints
metadata:
    name: almalinux-webui
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.242
      ports:
          - port: 9090
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
    name: insecure-skip-verify
    namespace: reverse-proxy
spec:
    insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: truenas
    namespace: reverse-proxy
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`truenas.clorofilla.casa`)
          kind: Rule
          services:
              - name: truenas
                port: 80
    tls:
        certResolver: default
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: zerobyte
    namespace: reverse-proxy
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`backups.clorofilla.casa`)
          kind: Rule
          services:
              - name: zerobyte
                port: 30314
    tls:
        certResolver: default
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: almalinux-webui
    namespace: reverse-proxy
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`almalinux.clorofilla.casa`)
          kind: Rule
          services:
              - name: almalinux-webui
                port: 9090
                scheme: https
                serversTransport: insecure-skip-verify
    tls:
        certResolver: default
