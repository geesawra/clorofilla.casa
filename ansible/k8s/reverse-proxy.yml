apiVersion: v1
kind: Namespace
metadata:
    name: reverse-proxy
---
apiVersion: v1
kind: Service
metadata:
    name: truenas
    namespace: reverse-proxy
spec:
    ports:
        - port: 80
          targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
    name: truenas
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.155
      ports:
          - port: 80
---
apiVersion: v1
kind: Service
metadata:
    name: zerobyte
    namespace: reverse-proxy
spec:
    ports:
        - port: 30314
          targetPort: 30314
---
apiVersion: v1
kind: Endpoints
metadata:
    name: zerobyte
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.155
      ports:
          - port: 30314
---
apiVersion: v1
kind: Service
metadata:
    name: bfg
    namespace: reverse-proxy
spec:
    ports:
        - port: 9090
          targetPort: 9090
---
apiVersion: v1
kind: Endpoints
metadata:
    name: bfg
    namespace: reverse-proxy
subsets:
    - addresses:
          - ip: 192.168.1.221
      ports:
          - port: 9090
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
    name: insecure-skip-verify
    namespace: reverse-proxy
spec:
    insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: truenas
    namespace: reverse-proxy
    annotations:
        gethomepage.dev/description: NAS management
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/href: https://truenas.clorofilla.casa
        gethomepage.dev/icon: truenas.png
        gethomepage.dev/name: TrueNAS
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`truenas.clorofilla.casa`)
          kind: Rule
          services:
              - name: truenas
                port: 80
    tls:
        certResolver: default
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: zerobyte
    namespace: reverse-proxy
    annotations:
        gethomepage.dev/description: Backup management
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/href: https://backups.clorofilla.casa
        gethomepage.dev/name: Backups
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`backups.clorofilla.casa`)
          kind: Rule
          services:
              - name: zerobyte
                port: 30314
    tls:
        certResolver: default
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: bfg
    namespace: reverse-proxy
    annotations:
        gethomepage.dev/description: Host management
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/href: https://bfg.clorofilla.casa
        gethomepage.dev/icon: cockpit.png
        gethomepage.dev/name: Cockpit
spec:
    entryPoints:
        - websecure
    routes:
        - match: Host(`bfg.clorofilla.casa`)
          kind: Rule
          services:
              - name: bfg
                port: 9090
                scheme: https
                serversTransport: insecure-skip-verify
    tls:
        certResolver: default
