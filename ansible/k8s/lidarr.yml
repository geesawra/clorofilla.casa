apiVersion: v1
kind: Namespace
metadata:
    name: torrents
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: lidarr-deployment
    namespace: torrents
    labels:
        app: lidarr
spec:
    replicas: 1
    selector:
        matchLabels:
            app: lidarr
    template:
        metadata:
            name: lidarr-pod
            namespace: torrents
            labels:
                app: lidarr
        spec:
            nodeSelector:
                kubernetes.io/hostname: bfg
            securityContext:
                fsGroup: 1000
            containers:
                - name: lidarr-container
                  image: lscr.io/linuxserver/lidarr:latest
                  ports:
                      - containerPort: 8686
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /config
                        name: config
                      - mountPath: /music
                        name: music
                      - mountPath: /downloads
                        name: downloads
                  env:
                      - name: PUID
                        value: "1000"
                      - name: PGID
                        value: "1000"
                      - name: TZ
                        value: "Europe/Rome"
                  readinessProbe:
                      httpGet:
                          path: /ping
                          port: 8686
                      initialDelaySeconds: 15
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /ping
                          port: 8686
                      initialDelaySeconds: 60
                      periodSeconds: 30
            volumes:
                - name: config
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/fast/1tb/services/lidarr/config
                      mountOptions:
                          - nfsvers=3
                - name: music
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/torrents/data/mine/files/complete
                      mountOptions:
                          - nfsvers=3
                - name: downloads
                  nfs:
                      server: 192.168.1.155
                      path: /mnt/torrents/data/mine/files
                      mountOptions:
                          - nfsvers=3
---
kind: Service
apiVersion: v1
metadata:
    name: lidarr-service
    namespace: torrents
spec:
    type: ClusterIP
    selector:
        app: lidarr
    ports:
        - protocol: TCP
          name: http
          port: 8686
          targetPort: 8686
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
    name: lidarr-route
    namespace: torrents
spec:
    entryPoints:
        - websecure
    routes:
        - kind: Rule
          match: Host(`lidarr.clorofilla.casa`)
          priority: 10
          services:
              - name: lidarr-service
                port: 8686
    tls:
        certResolver: default
