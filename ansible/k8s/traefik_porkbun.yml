apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
    name: traefik
    namespace: kube-system
spec:
    valuesContent: |-
        ports:
          torrent-tcp:
            port: 51413
            exposedPort: 51413
            protocol: TCP
          torrent-udp:
            port: 51413
            exposedPort: 51413
            protocol: UDP
        additionalArguments:
          - "--certificatesresolvers.default.acme.email=hello@geesawra.industries"
          - "--certificatesresolvers.default.acme.storage=/data/acme.json"
          - "--certificatesresolvers.default.acme.dnschallenge=true"
          - "--certificatesresolvers.default.acme.dnschallenge.provider=porkbun"
          - "--certificatesresolvers.default.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
        env:
          - name: PORKBUN_API_KEY
            valueFrom:
              secretKeyRef:
                name: porkbun-api-credentials
                key: api-key
          - name: PORKBUN_SECRET_API_KEY
            valueFrom:
              secretKeyRef:
                name: porkbun-api-credentials
                key: secret-api-key
