---
# Cockpit retains its native host port 9090; Prometheus uses host port 9092.
- name: Install and enable Cockpit
  hosts: k3s_cluster
  become: true
  tags: monitoring,cockpit
  tasks:
      - name: Install Cockpit
        ansible.builtin.dnf:
            name: cockpit
            state: present

      - name: Enable and start Cockpit
        ansible.builtin.systemd:
            name: cockpit.socket
            state: started
            enabled: true
        when: not ansible_check_mode

# Docker is used here only for the existing node_exporter container.
# Immich ML is deployed by the Immich Helm chart in 2_services.yml.
- name: Install and enable Docker for node_exporter
  hosts: k3s_cluster
  become: true
  tags: monitoring,docker
  tasks:
      - name: Check whether Docker is installed
        ansible.builtin.command: docker --version
        register: docker_version
        changed_when: false
        failed_when: false

      - name: Assert the node is the supported Fedora host
        ansible.builtin.assert:
            that:
                - ansible_facts['distribution'] == "Fedora"
            fail_msg: >-
                Docker provisioning in this repository supports Fedora bfg only;
                do not use a different distribution repository without updating this playbook.

      - name: Install Docker on Fedora
        when: docker_version.rc != 0
        block:
            - name: Install Docker repository prerequisites
              ansible.builtin.dnf:
                  name:
                      - ca-certificates
                      - dnf-plugins-core
                  state: present

            - name: Configure Docker repository
              ansible.builtin.get_url:
                  url: https://download.docker.com/linux/fedora/docker-ce.repo
                  dest: /etc/yum.repos.d/docker-ce.repo
                  mode: "0644"

            - name: Install Docker Engine
              ansible.builtin.dnf:
                  name:
                      - docker-ce
                      - docker-ce-cli
                      - containerd.io
                      - docker-buildx-plugin
                      - docker-compose-plugin
                  state: present

      - name: Start and enable Docker
        ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true
        when: not ansible_check_mode

      - name: Verify Docker is available
        ansible.builtin.command: docker version
        changed_when: false
        when: not ansible_check_mode

- name: Deploy node_exporter on all k3s cluster nodes
  hosts: k3s_cluster
  become: true
  tags: monitoring
  tasks:
      - name: Ensure textfile collector directory exists
        ansible.builtin.file:
            path: /var/lib/node_exporter/textfile_collector
            state: directory
            mode: "0755"

      - name: Stop existing node_exporter container if present
        ansible.builtin.command: docker stop node_exporter
        changed_when: false
        failed_when: false
        when: not ansible_check_mode

      - name: Remove existing node_exporter container if present
        ansible.builtin.command: docker rm node_exporter
        changed_when: false
        failed_when: false
        when: not ansible_check_mode

      - name: Deploy node_exporter Docker container
        ansible.builtin.command:
            cmd: >-
                docker run -d --name=node_exporter --restart=unless-stopped
                --net=host --privileged
                -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /:/rootfs:ro
                -v /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
                prom/node-exporter:latest
                --path.procfs=/host/proc --path.sysfs=/host/sys
                --path.rootfs=/rootfs
                --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)
                --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
        register: node_exporter_deploy
        changed_when: "'already running' not in node_exporter_deploy.stdout"
        when: not ansible_check_mode

- name: Deploy monitoring stack
  hosts: localhost
  become: false
  tags: monitoring
  tasks:
      - name: Create monitoring namespace
        kubernetes.core.k8s:
            state: present
            definition:
                apiVersion: v1
                kind: Namespace
                metadata:
                    name: monitoring

      - name: Add prometheus-community helm repo
        kubernetes.core.helm_repository:
            name: prometheus-community
            repo_url: https://prometheus-community.github.io/helm-charts
            binary_path: /usr/bin/helm3
        when: not ansible_check_mode

      - name: Deploy kube-state-metrics
        kubernetes.core.helm:
            name: kube-state-metrics
            chart_ref: prometheus-community/kube-state-metrics
            release_namespace: monitoring
            create_namespace: true
            values_files:
                - k8s/monitoring/kube-state-metrics-values.yml
            binary_path: /usr/bin/helm3
        when: not ansible_check_mode

      - name: Deploy Prometheus server
        kubernetes.core.k8s:
            state: present
            src: k8s/monitoring/prometheus.yml
        when: not ansible_check_mode

      - name: Deploy Grafana
        kubernetes.core.k8s:
            state: present
            src: k8s/monitoring/grafana.yml
        when: not ansible_check_mode
