---
# ── Docker installation (idempotent) ──

- name: Install Docker on k3s nodes
  hosts: k3s_cluster
  become: true
  tags: monitoring, docker
  tasks:
      - name: Check if Docker is already installed
        ansible.builtin.shell:
            cmd: which docker
        register: docker_check
        changed_when: false
        failed_when: false

      # ── RHEL (AlmaLinux) install path ──
      - name: Install Docker on RHEL
        when: docker_check.rc != 0 and ansible_facts['os_family'] == "RedHat"
        block:
            - name: Uninstall conflicting Docker packages
              ansible.builtin.dnf:
                  name:
                      - docker
                      - docker-client
                      - docker-client-latest
                      - docker-common
                      - docker-latest
                      - docker-latest-logrotate
                      - docker-logrotate
                      - docker-engine
                      - docker-selinux
                      - docker-engine-selinux
                      - containerd.io
                  state: absent

            - name: Install prerequisites for Docker repo
              ansible.builtin.dnf:
                  name:
                      - dnf-plugins-core
                      - device-mapper-persistent-data
                      - lvm2
                      - bash-completion
                  state: present

            - name: Add Docker repository
              ansible.builtin.command:
                  cmd: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo

            - name: Install Docker Engine
              ansible.builtin.dnf:
                  name:
                      - docker-ce
                      - docker-ce-cli
                      - containerd.io
                      - docker-buildx-plugin
                      - docker-compose-plugin
                  state: present

            - name: Start and enable Docker service
              ansible.builtin.systemd:
                  name: docker
                  state: started
                  enabled: yes
              when: not ansible_check_mode

      # ── Debian install path (e.g. MNT Reform) ──
      - name: Install Docker on Debian
        when: docker_check.rc != 0 and ansible_facts['os_family'] == "Debian"
        block:
            - name: Uninstall conflicting Docker packages (Debian)
              ansible.builtin.apt:
                  name:
                      - docker.io
                      - docker-compose
                      - docker-doc
                      - podman-docker
                      - containerd
                      - runc
                  state: absent

            - name: Install prerequisites for Docker repo (Debian)
              ansible.builtin.apt:
                  name:
                      - ca-certificates
                      - curl
                  state: present

            - name: Create keyrings directory
              ansible.builtin.file:
                  path: /etc/apt/keyrings
                  state: directory
                  mode: "0755"

            - name: Download Docker GPG key (Debian)
              ansible.builtin.get_url:
                  url: https://download.docker.com/linux/debian/gpg
                  dest: /etc/apt/keyrings/docker.asc
                  mode: "0644"

            - name: Add Docker repository (Debian)
              ansible.builtin.apt_repository:
                  repo: >-
                      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
                      https://download.docker.com/linux/debian
                      {{ 'bookworm' if ansible_facts['distribution_release'] == 'forky' else ansible_facts['distribution_release'] }}
                      stable
                  state: present

            - name: Install Docker Engine (Debian)
              ansible.builtin.apt:
                  name:
                      - docker-ce
                      - docker-ce-cli
                      - containerd.io
                      - docker-buildx-plugin
                      - docker-compose-plugin
                  state: present
                  update_cache: yes

            - name: Start and enable Docker service
              ansible.builtin.systemd:
                  name: docker
                  state: started
                  enabled: yes
              when: not ansible_check_mode

      - name: Verify Docker is running
        ansible.builtin.command: docker version
        changed_when: false
        register: docker_version_check
        when: docker_check.rc != 0

# ── Deploy monitoring stack ──

- name: Deploy node_exporter on all k3s cluster nodes
  hosts: k3s_cluster
  become: true
  tags: monitoring
  tasks:
      - name: Stop existing node_exporter container if present
        ansible.builtin.command: docker stop node_exporter
        changed_when: false
        failed_when: false
        when: not ansible_check_mode

      - name: Remove existing node_exporter container if present
        ansible.builtin.command: docker rm node_exporter
        changed_when: false
        failed_when: false
        when: not ansible_check_mode

      - name: Deploy node_exporter Docker container
        ansible.builtin.command:
            cmd: >-
                docker run -d --name=node_exporter --restart=unless-stopped
                --net=host --privileged
                -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /:/rootfs:ro
                prom/node-exporter:latest
                --path.procfs=/host/proc --path.sysfs=/host/sys
                --path.rootfs=/rootfs
                --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)
        register: node_exporter_deploy
        changed_when: "'already running' not in node_exporter_deploy.stdout"
        when: not ansible_check_mode

- name: Deploy monitoring stack
  hosts: localhost
  become: false
  tags: monitoring
  tasks:
      - name: Create monitoring namespace
        kubernetes.core.k8s:
            state: present
            definition:
                apiVersion: v1
                kind: Namespace
                metadata:
                    name: monitoring

      - name: Add prometheus-community helm repo
        kubernetes.core.helm_repository:
            name: prometheus-community
            repo_url: https://prometheus-community.github.io/helm-charts
            binary_path: /usr/bin/helm3
        when: not ansible_check_mode

      - name: Deploy kube-state-metrics
        kubernetes.core.helm:
            name: kube-state-metrics
            chart_ref: prometheus-community/kube-state-metrics
            release_namespace: monitoring
            create_namespace: true
            values_files:
                - k8s/monitoring/kube-state-metrics-values.yml
            binary_path: /usr/bin/helm3
        when: not ansible_check_mode

      - name: Remove old prometheus-agent DaemonSet
        kubernetes.core.k8s:
            state: absent
            api_version: apps/v1
            kind: DaemonSet
            namespace: monitoring
            name: prometheus-agent
        when: not ansible_check_mode

      - name: Remove old prometheus-agent ConfigMap
        kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: ConfigMap
            namespace: monitoring
            name: prometheus-agent-config
        when: not ansible_check_mode

      - name: Deploy Prometheus server
        kubernetes.core.k8s:
            state: present
            src: k8s/monitoring/prometheus.yml
        when: not ansible_check_mode

      - name: Deploy Grafana
        kubernetes.core.k8s:
            state: present
            src: k8s/monitoring/grafana.yml
        when: not ansible_check_mode
