---
- name: Validate bfg GPU prerequisites for Immich
  hosts: bfg
  become: true
  tags: immich,immich-ml
  tasks:
    - name: Inspect AMD KFD device
      ansible.builtin.stat:
        path: /dev/kfd
      register: immich_kfd

    - name: Inspect AMD DRM card devices
      ansible.builtin.find:
        paths: /dev/dri
        patterns: "card*"
        file_type: any
      register: immich_dri_cards

    - name: Inspect AMD DRM render devices
      ansible.builtin.find:
        paths: /dev/dri
        patterns: "renderD*"
        file_type: any
      register: immich_dri_renders

    - name: Read Fedora video group
      ansible.builtin.command: getent group video
      register: immich_video_group
      changed_when: false
      check_mode: false

    - name: Read Fedora render group
      ansible.builtin.command: getent group render
      register: immich_render_group
      changed_when: false
      check_mode: false

    # A shell is required because Ansible's command module does not expand the
    # PCI BDF glob. These IDs are the stable selectors used by the DRA claims.
    - name: Read AMD PCI device IDs
      ansible.builtin.shell:
        cmd: >-
          cat
          /sys/module/amdgpu/drivers/pci:amdgpu/[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]:*/device
        executable: /usr/bin/bash
      register: immich_amd_pci_device_ids
      changed_when: false
      check_mode: false

    - name: Assert the AMD GPU devices are present
      ansible.builtin.assert:
        that:
          - immich_kfd.stat.exists and immich_kfd.stat.ischr
          - immich_dri_cards.matched >= 2
          - immich_dri_renders.matched >= 2
          - immich_video_group.rc == 0
          - immich_video_group.stdout is regex(':39:')
          - immich_render_group.rc == 0
          - immich_render_group.stdout is regex(':105:')
          - "'0x164e' in immich_amd_pci_device_ids.stdout_lines"
          - "'0x73a5' in immich_amd_pci_device_ids.stdout_lines"
        fail_msg: >-
          bfg must expose /dev/kfd, at least two AMD DRM card/render devices,
          the Raphael GPU (PCI device ID 0x164e), and the RX 6950 XT
          (PCI device ID 0x73a5) before Immich can allocate deterministic GPUs.

- name: Deploy K8s services
  hosts: localhost
  become: false
  tags: k8s
  tasks:
    - name: Add NFS provisioner Helm repo
      kubernetes.core.helm_repository:
        name: nfs-subdir-external-provisioner
        repo_url: >-
          https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/

    - name: Deploy NFS provisioner
      kubernetes.core.helm:
        name: nfs-provisioner
        chart_ref: >-
          nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
        release_namespace: kube-system
        create_namespace: true
        values:
          nfs:
            server: "{{ nas_ip }}"
            path: "{{ nas_path }}"
          storageClass:
            name: nfs-client
            defaultClass: false

    - name: Mount services share from NAS on host
      tags: jackett
      ansible.posix.mount:
        path: /mnt/nfs/jackett
        src: "{{ nas_ip }}:/mnt/fast/1tb/services"
        fstype: nfs
        opts: vers=3,soft,timeo=300,retrans=3
        state: mounted
      delegate_to: bfg
      become: true

    - name: Create Jackett config dir on NAS
      tags: jackett
      ansible.builtin.file:
        path: /mnt/nfs/jackett/config
        state: directory
        mode: "0755"
      delegate_to: bfg
      become: true

    - name: Unmount services share from host
      tags: jackett
      ansible.posix.mount:
        path: /mnt/nfs/jackett
        state: absent
      delegate_to: bfg
      become: true

    - name: Deploy Jackett
      tags: jackett
      kubernetes.core.k8s:
        state: present
        src: k8s/jackett.yml

    - name: Mount services share for Lidarr config
      tags: lidarr
      ansible.posix.mount:
        path: /mnt/nfs/lidarr
        src: "{{ nas_ip }}:/mnt/fast/1tb/services"
        fstype: nfs
        opts: vers=3,soft,timeo=300,retrans=3
        state: mounted
      delegate_to: bfg
      become: true

    - name: Create Lidarr config dir on NAS
      tags: lidarr
      ansible.builtin.file:
        path: /mnt/nfs/lidarr/lidarr/config
        state: directory
        mode: "0755"
      delegate_to: bfg
      become: true

    - name: Unmount services share after creating Lidarr config dir
      tags: lidarr
      ansible.posix.mount:
        path: /mnt/nfs/lidarr
        state: absent
      delegate_to: bfg
      become: true

    - name: Deploy Lidarr
      tags: lidarr
      kubernetes.core.k8s:
        state: present
        src: k8s/lidarr.yml

    - name: Deploy Home Assistant stable
      tags: ha
      kubernetes.core.k8s:
        state: present
        src: k8s/ha.yml

    - name: Deploy Transmission for my torrents
      tags: transmission
      kubernetes.core.k8s:
        state: present
        src: k8s/transmission.yml

    - name: Deploy Transmission for other's torrents
      tags: transmission-others,transmission
      kubernetes.core.k8s:
        state: present
        src: k8s/transmission_others.yml

    - name: Deploy AMD GPU DRA driver
      tags: amd-gpu,immich,immich-ml
      kubernetes.core.helm:
        name: amd-gpu-dra
        chart_ref: >-
          https://github.com/ROCm/k8s-gpu-dra-driver/releases/download/v1.0.1/k8s-gpu-dra-driver-v1.0.1.tgz
        release_namespace: kube-amd-gpu
        create_namespace: true
        release_state: present
        wait: true
        wait_timeout: 5m
      when: not ansible_check_mode

    - name: Verify the AMD GPU DRA device class
      tags: amd-gpu,immich,immich-ml
      kubernetes.core.k8s_info:
        api_version: resource.k8s.io/v1
        kind: DeviceClass
        name: gpu.amd.com
      register: amd_gpu_dra_device_class
      failed_when: amd_gpu_dra_device_class.resources | length != 1
      when: not ansible_check_mode

    - name: Wait for DRA to publish both AMD GPUs
      tags: amd-gpu,immich,immich-ml
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - resourceslices
          - -o
          - 'jsonpath={range .items[?(@.spec.driver=="gpu.amd.com")].spec.devices[*]}{.attributes.deviceID.string}{"\n"}{end}'
      register: amd_gpu_dra_device_ids
      changed_when: false
      retries: 30
      delay: 2
      until:
        - "'0x164e' in amd_gpu_dra_device_ids.stdout_lines"
        - "'0x73a5' in amd_gpu_dra_device_ids.stdout_lines"
      when: not ansible_check_mode

    - name: Deploy postgres operator
      tags: postgres,immich,immich-ml,audiomuse,navidrome
      kubernetes.core.k8s:
        state: present
        src: >-
          https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.28/releases/cnpg-1.28.0.yaml

    - name: Wait for CloudNativePG CRDs to be established
      tags: postgres,immich,immich-ml,audiomuse,navidrome
      ansible.builtin.command: >-
        kubectl wait --for=condition=Established
        crd/clusters.postgresql.cnpg.io
        crd/poolers.postgresql.cnpg.io
        crd/backups.postgresql.cnpg.io
        --timeout=180s
      changed_when: false

    - name: Wait for CloudNativePG controller to be Available
      tags: postgres,immich,immich-ml,audiomuse,navidrome
      ansible.builtin.command: >-
        kubectl wait --for=condition=Available
        deployment/cnpg-controller-manager
        -n cnpg-system --timeout=180s
      changed_when: false

    - name: Deploy Immich dependencies
      tags: immich,immich-ml
      kubernetes.core.k8s:
        state: present
        src: k8s/immich.yml

    - name: Recover Immich GPU claims with missing CDI device entries
      tags: immich,immich-ml
      ansible.builtin.include_tasks:
        file: tasks/immich_gpu_recovery.yml
        apply:
          tags: immich,immich-ml
      when: not ansible_check_mode

    - name: Prepare Immich HDD storage after the verified copy
      tags: immich,immich-ml
      ansible.builtin.include_tasks:
        file: tasks/immich_hdd_storage.yml
        apply:
          tags: immich,immich-ml
      when: immich_hdd_storage_enabled | default(false) | bool

    - name: Provision the automatic Immich GPU recovery script
      tags: immich,immich-ml,immich-gpu-recovery
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: immich-gpu-recovery
            namespace: immich
          data:
            immich_gpu_recovery.py: '{{ lookup("ansible.builtin.file", "k8s/immich_gpu_recovery.py") }}'
      when: not ansible_check_mode

    - name: Schedule automatic Immich GPU recovery
      tags: immich,immich-ml,immich-gpu-recovery
      kubernetes.core.k8s:
        state: present
        src: k8s/immich_gpu_recovery.yml
      when: not ansible_check_mode

    - name: Deploy Immich through Helm
      tags: immich,immich-ml
      kubernetes.core.helm:
        name: immich
        chart_ref: oci://ghcr.io/immich-app/immich-charts/immich
        chart_version: 0.13.1
        release_namespace: immich
        wait: true
        wait_timeout: 10m
        values_files: >-
          {{ ['k8s/immich_values.yml'] +
             (['k8s/immich_hdd_values.yml']
              if immich_hdd_storage_enabled | default(false) | bool else []) }}

    - name: Find the Immich ML pod
      tags: immich,immich-ml
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: immich
        label_selectors:
          - app.kubernetes.io/name=machine-learning
      register: immich_ml_pods
      until:
        - immich_ml_pods.resources | length == 1
        - >-
          immich_ml_pods.resources[0].status.conditions | default([]) |
          selectattr('type', 'equalto', 'Ready') |
          selectattr('status', 'equalto', 'True') | list | length == 1
      retries: 120
      delay: 5
      when: not ansible_check_mode

    - name: Find the Immich server pod
      tags: immich,immich-ml
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: immich
        label_selectors:
          - app.kubernetes.io/name=server
      register: immich_server_pods
      until:
        - immich_server_pods.resources | length == 1
        - >-
          immich_server_pods.resources[0].status.conditions | default([]) |
          selectattr('type', 'equalto', 'Ready') |
          selectattr('status', 'equalto', 'True') | list | length == 1
      retries: 120
      delay: 5
      when: not ansible_check_mode

    - name: Verify the Immich GPU pods are unique and ready
      tags: immich,immich-ml
      ansible.builtin.assert:
        that:
          - immich_ml_pods.resources | length == 1
          - immich_ml_pods.resources[0].status.phase == 'Running'
          - >-
            immich_ml_pods.resources[0].status.conditions |
            selectattr('type', 'equalto', 'Ready') |
            selectattr('status', 'equalto', 'True') |
            list | length == 1
          - immich_server_pods.resources | length == 1
          - immich_server_pods.resources[0].status.phase == 'Running'
          - >-
            immich_server_pods.resources[0].status.conditions |
            selectattr('type', 'equalto', 'Ready') |
            selectattr('status', 'equalto', 'True') |
            list | length == 1
        fail_msg: >-
          Expected exactly one ready Immich ML pod and one ready Immich server
          pod after the Helm deployment.
      when: not ansible_check_mode

    - name: Verify the GPU assigned to Immich ML
      tags: immich,immich-ml
      kubernetes.core.k8s_exec:
        namespace: immich
        pod: "{{ immich_ml_pods.resources[0].metadata.name }}"
        command: >-
          /bin/sh -c 'test -c /dev/kfd &&
          test "$(find /dev/dri -maxdepth 1 -name "card*" | wc -l)" -eq 1 &&
          test "$(find /dev/dri -maxdepth 1 -name "renderD*" | wc -l)" -eq 1 &&
          for device in /dev/dri/card* /dev/dri/renderD*; do
          test "$(cat "/sys/class/drm/${device##*/}/device/device")" = "0x73a5"; done &&
          rocminfo | grep -q "Name:.*gfx1030" &&
          python3 -c "import urllib.request; assert urllib.request.urlopen(\"http://127.0.0.1:3003/ping\").read() == b\"pong\""'
      changed_when: false
      when: not ansible_check_mode

    - name: Verify the GPU assigned to Immich server
      tags: immich,immich-ml
      kubernetes.core.k8s_exec:
        namespace: immich
        pod: "{{ immich_server_pods.resources[0].metadata.name }}"
        command: >-
          /bin/sh -c 'test -c /dev/kfd &&
          test "$(find /dev/dri -maxdepth 1 -name "card*" | wc -l)" -eq 1 &&
          test "$(find /dev/dri -maxdepth 1 -name "renderD*" | wc -l)" -eq 1 &&
          for device in /dev/dri/card* /dev/dri/renderD*; do
          test "$(cat "/sys/class/drm/${device##*/}/device/device")" = "0x164e"; done &&
          ffmpeg -hide_banner -hwaccels 2>/dev/null | grep -qx "vaapi"'
      changed_when: false
      when: not ansible_check_mode

    - name: Deploy Navidrome
      tags: navidrome,audiomuse
      kubernetes.core.k8s:
        state: present
        src: k8s/navidrome.yml

    - name: Uninstall AudioMuse-AI
      tags: navidrome,audiomuse
      kubernetes.core.helm:
        name: audiomuse
        release_namespace: navidrome
        release_state: absent
        wait: true
        wait_timeout: 5m
      when: not ansible_check_mode

    - name: Remove AudioMuse-AI ROCm worker
      tags: navidrome,audiomuse
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        name: audiomuse-rocm-worker
        namespace: navidrome
        wait: true
      when: not ansible_check_mode

    - name: Remove AudioMuse-AI ingress
      tags: navidrome,audiomuse
      kubernetes.core.k8s:
        state: absent
        api_version: traefik.io/v1alpha1
        kind: IngressRoute
        name: audiomuse-route
        namespace: navidrome
      when: not ansible_check_mode

    - name: Find the retained AudioMuse-AI database
      tags: navidrome,audiomuse
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: audiomuse-database
        namespace: navidrome
      register: audiomuse_database
      when: not ansible_check_mode

    # Hibernation stops PostgreSQL without deleting its Cluster, PVCs, or data.
    - name: Hibernate the retained AudioMuse-AI database
      tags: navidrome,audiomuse
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: audiomuse-database
            namespace: navidrome
            annotations:
              cnpg.io/hibernation: "on"
        wait: true
        wait_timeout: 300
        wait_condition:
          type: cnpg.io/hibernation
          status: "True"
          reason: Hibernated
      when:
        - not ansible_check_mode
        - audiomuse_database.resources | length > 0

    - name: Deploy reverse proxied services
      tags: reverse-proxy
      kubernetes.core.k8s:
        state: present
        src: k8s/reverse-proxy.yml
